<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" fill="none">
  <title>Raios de gravura do carnaval noturno</title>
  <desc>Fundo decorativo original com raios vinho, círculos concêntricos e textura discreta.</desc>
  <defs>
