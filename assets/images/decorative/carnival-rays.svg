      <use href="#ray" transform="rotate(135 450 450)"/><use href="#ray" transform="rotate(146.25 450 450)"/><use href="#ray" transform="rotate(157.5 450 450)"/><use href="#ray" transform="rotate(168.75 450 450)"/>
      <use href="#ray" transform="rotate(180 450 450)"/><use href="#ray" transform="rotate(191.25 450 450)"/><use href="#ray" transform="rotate(202.5 450 450)"/><use href="#ray" transform="rotate(213.75 450 450)"/>
      <use href="#ray" transform="rotate(225 450 450)"/><use href="#ray" transform="rotate(236.25 450 450)"/><use href="#ray" transform="rotate(247.5 450 450)"/><use href="#ray" transform="rotate(258.75 450 450)"/>
      <use href="#ray" transform="rotate(270 450 450)"/><use href="#ray" transform="rotate(281.25 450 450)"/><use href="#ray" transform="rotate(292.5 450 450)"/><use href="#ray" transform="rotate(303.75 450 450)"/>
