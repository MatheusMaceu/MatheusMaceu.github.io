    <g id="ray"><path d="M450 450 432 0h36Z" fill="#a2373e" fill-opacity=".18"/></g>
    <pattern id="engraving" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 6 6 0" stroke="#eee5d5" stroke-opacity=".035" stroke-width=".45"/></pattern>
  </defs>
